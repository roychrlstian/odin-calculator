<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Odin Calculator</h1>
        <div class="container">
            <input type="text" id="display" disabled>
            <div class="buttons">
                <button class="btn clear">C</button>
                <button class="btn percent">%</button>
                <button class="btn backspace">←</button>
                <button class="btn divide">÷</button>
                <button class="btn number">7</button>
                <button class="btn number">8</button>
                <button class="btn number">9</button>
                <button class="btn multiply">×</button>
                <button class="btn number">4</button>
                <button class="btn number">5</button>
                <button class="btn number">6</button>
                <button class="btn subtract">−</button>
                <button class="btn number">1</button>
                <button class="btn number">2</button>
                <button class="btn number">3</button>
                <button class="btn add">+</button>
                <button class="btn number">00</button>
                <button class="btn number">0</button>
                <button class="btn decimal">.</button>
                <button class="btn equals">=</button>
            </div>
        </div>
    </main>
    <footer class="site-footer" aria-label="Copyright">
